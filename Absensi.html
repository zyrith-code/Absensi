<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absensi Siswa</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #dbeafe, #f0fdf4);
  color: #222;
}

.container {
  width: 95%;
  max-width: 900px;
  margin: 25px auto;
}

.card {
  background: white;
  padding: 20px;
  margin-bottom: 20px;
  border-radius: 18px;
  box-shadow: 0 5px 20px rgba(0,0,0,.1);
}

h1, h2 {
  text-align: center;
}

input, select, button {
  width: 100%;
  padding: 13px;
  margin: 7px 0;
  border-radius: 10px;
  border: 1px solid #ccc;
  font-size: 16px;
}

button {
  border: none;
  background: #16a34a;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  opacity: .9;
}

.admin-btn {
  background: #2563eb;
}

.delete-btn {
  background: #dc2626;
  padding: 8px;
  margin: 2px;
  width: auto;
}

.delete-all {
  background: #dc2626;
}

.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 20px;
}

.stat {
  padding: 15px;
  border-radius: 12px;
  text-align: center;
  background: #f3f4f6;
  font-weight: bold;
}

.table-container {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 750px;
}

th, td {
  border: 1px solid #ddd;
  padding: 10px;
  text-align: center;
}

th {
  background: #2563eb;
  color: white;
}

.hidden {
  display: none;
}

.info {
  text-align: center;
  color: #555;
  font-size: 14px;
}

@media (max-width: 600px) {
  .stats {
    grid-template-columns: repeat(2, 1fr);
  }

  .card {
    padding: 15px;
  }

  h1 {
    font-size: 25px;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- FORM ABSENSI -->
  <div class="card">
    <h1>📋 ABSENSI SISWA</h1>

    <p class="info">
      Isi data lalu tekan <b>Enter</b> atau tombol Kirim.
    </p>

    <form id="absensiForm">

      <input
        type="text"
        id="nama"
        placeholder="Nama siswa"
        required
      >

      <select id="kelas" required>
        <option value="">-- Pilih Kelas --</option>
        <option value="X AK B">X AK B</option>
      </select>

      <select id="status" required>
        <option value="">-- Pilih Status --</option>
        <option value="Hadir">Hadir</option>
        <option value="Izin">Izin</option>
        <option value="Sakit">Sakit</option>
        <option value="Alpa">Alpa</option>
      </select>

      <input
        type="text"
        id="keterangan"
        placeholder="Keterangan (opsional)"
      >

      <button type="submit">
        📱 KIRIM ABSENSI KE WHATSAPP
      </button>

    </form>
  </div>


  <!-- LOGIN ADMIN -->
  <div class="card">
    <h2>🔐 Admin</h2>

    <input
      type="text"
      id="username"
      placeholder="Username"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button class="admin-btn" onclick="loginAdmin()">
      LOGIN ADMIN
    </button>
  </div>


  <!-- PANEL ADMIN -->
  <div id="adminPanel" class="hidden">

    <div class="card">
      <h2>📊 DATA ABSENSI</h2>

      <div class="stats">

        <div class="stat">
          Hadir<br>
          <span id="jumlahHadir">0</span>
        </div>

        <div class="stat">
          Izin<br>
          <span id="jumlahIzin">0</span>
        </div>

        <div class="stat">
          Sakit<br>
          <span id="jumlahSakit">0</span>
        </div>

        <div class="stat">
          Alpa<br>
          <span id="jumlahAlpa">0</span>
        </div>

      </div>

      <div class="table-container">

        <table>

          <thead>
            <tr>
              <th>No</th>
              <th>Nama</th>
              <th>Kelas</th>
              <th>Status</th>
              <th>Keterangan</th>
              <th>Tanggal</th>
              <th>Waktu</th>
              <th>Aksi</th>
            </tr>
          </thead>

          <tbody id="dataAbsensi"></tbody>

        </table>

      </div>

      <br>

      <button class="delete-all" onclick="hapusSemuaData()">
        🗑️ HAPUS SEMUA DATA
      </button>

    </div>

  </div>

</div>


<script>

// ================================
// NOMOR WHATSAPP ADMIN
// ================================

const nomorWhatsApp = "6281990233946";


// ================================
// DATABASE LOCAL STORAGE
// ================================

let dataAbsensi =
  JSON.parse(localStorage.getItem("dataAbsensi")) || [];


// ================================
// FORM ABSENSI
// ================================

document
.getElementById("absensiForm")
.addEventListener("submit", function(e) {

  e.preventDefault();

  const nama =
    document.getElementById("nama").value.trim();

  const kelas =
    document.getElementById("kelas").value;

  const status =
    document.getElementById("status").value;

  const keterangan =
    document.getElementById("keterangan").value.trim() ||
    "-";

  if (!nama || !kelas || !status) {
    alert("Mohon lengkapi data absensi!");
    return;
  }


  // Tanggal dan waktu
  const sekarang = new Date();

  const tanggal =
    sekarang.toLocaleDateString("id-ID");

  const waktu =
    sekarang.toLocaleTimeString("id-ID");


  // Data baru
  const dataBaru = {
    id: Date.now(),
    nama: nama,
    kelas: kelas,
    status: status,
    keterangan: keterangan,
    tanggal: tanggal,
    waktu: waktu
  };


  // Simpan
  dataAbsensi.push(dataBaru);

  localStorage.setItem(
    "dataAbsensi",
    JSON.stringify(dataAbsensi)
  );


  // ================================
  // PESAN WHATSAPP
  // ================================

  const pesan =
`📋 ABSENSI SISWA

👤 Nama: ${nama}
🏫 Kelas: ${kelas}
📌 Status: ${status}
📝 Keterangan: ${keterangan}
📅 Tanggal: ${tanggal}
⏰ Waktu: ${waktu}`;


  const linkWhatsApp =
    "https://wa.me/" +
    nomorWhatsApp +
    "?text=" +
    encodeURIComponent(pesan);


  // Buka WhatsApp
  window.location.href = linkWhatsApp;


  // Reset form
  document.getElementById("absensiForm").reset();

});


// ================================
// LOGIN ADMIN
// ================================

function loginAdmin() {

  const username =
    document.getElementById("username").value;

  const password =
    document.getElementById("password").value;


  if (
    username === "admin" &&
    password === "12345"
  ) {

    document
      .getElementById("adminPanel")
      .classList.remove("hidden");

    tampilkanData();

    alert("Login admin berhasil!");

  } else {

    alert("Username atau password salah!");

  }

}


// ================================
// TAMPILKAN DATA
// ================================

function tampilkanData() {

  const tbody =
    document.getElementById("dataAbsensi");

  tbody.innerHTML = "";


  let hadir = 0;
  let izin = 0;
  let sakit = 0;
  let alpa = 0;


  dataAbsensi.forEach((data, index) => {

    if (data.status === "Hadir") hadir++;
    if (data.status === "Izin") izin++;
    if (data.status === "Sakit") sakit++;
    if (data.status === "Alpa") alpa++;


    const row =
      document.createElement("tr");


    row.innerHTML = `
      <td>${index + 1}</td>

      <td>${escapeHTML(data.nama)}</td>

      <td>${escapeHTML(data.kelas)}</td>

      <td>${escapeHTML(data.status)}</td>

      <td>${escapeHTML(data.keterangan)}</td>

      <td>${data.tanggal}</td>

      <td>${data.waktu}</td>

      <td>
        <button
          class="delete-btn"
          onclick="hapusData(${data.id})">
          🗑️ Hapus
        </button>
      </td>
    `;


    tbody.appendChild(row);

  });


  document.getElementById("jumlahHadir").textContent =
    hadir;

  document.getElementById("jumlahIzin").textContent =
    izin;

  document.getElementById("jumlahSakit").textContent =
    sakit;

  document.getElementById("jumlahAlpa").textContent =
    alpa;

}


// ================================
// HAPUS SATU DATA
// ================================

function hapusData(id) {

  if (!confirm("Yakin ingin menghapus data ini?")) {
    return;
  }


  dataAbsensi =
    dataAbsensi.filter(data => data.id !== id);


  localStorage.setItem(
    "dataAbsensi",
    JSON.stringify(dataAbsensi)
  );


  tampilkanData();

}


// ================================
// HAPUS SEMUA DATA
// ================================

function hapusSemuaData() {

  if (
    !confirm(
      "Yakin ingin menghapus SEMUA data absensi?"
    )
  ) {
    return;
  }


  dataAbsensi = [];

  localStorage.removeItem("dataAbsensi");

  tampilkanData();

}


// ================================
// KEAMANAN TAMPILAN DATA
// ================================

function escapeHTML(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}

</script>

</body>
</html>
